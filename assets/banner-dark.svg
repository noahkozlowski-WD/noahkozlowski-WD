  <rect x="72" y="86" width="56" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="160" fill="#f1f1f6" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.5">Noah Kozlowski</text>
  <text x="72" y="206" fill="#9d9db5" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500">Full-Stack Web Developer · Next.js · TypeScript · React</text>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9d9db5">
    <text x="840" y="118"><tspan fill="#ec4899">const</tspan> <tspan fill="#f1f1f6">noah</tspan> = {</text>
    <text x="864" y="146">role: <tspan fill="#6366f1">"developer"</tspan>,</text>
    <text x="864" y="174">base: <tspan fill="#6366f1">"South Africa"</tspan>,</text>
    <text x="864" y="202">open: <tspan fill="#ec4899">true</tspan>,</text>
    <text x="840" y="230">};</text>
